# --- Split / dongle setup ---
# The dongle has no key matrix; peripherals (left/right) handle scanning.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# --- Power ---
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

# --- HID ---
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# --- BT TX power ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Prospector display module ---
# Disable ambient light sensor if building without one (Prospector hardware
# uses a sensor, but omit this line if your unit has one).
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Uncomment to rotate the display 180 degrees:
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# Uncomment to show layer names in ALL CAPS on the roller:
# CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=y

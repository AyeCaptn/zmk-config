# --- Split / dongle setup ---
# The dongle has no key matrix; peripherals (left/right) handle scanning.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# --- Power ---
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

# --- HID ---
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# --- BT TX power ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# =============================================================================
# YADS (zmk-dongle-screen) Configuration
# =============================================================================

# --- Screen orientation ---
# Horizontal = screen lays on its side (wider than tall). Set to n for vertical.
CONFIG_DONGLE_SCREEN_HORIZONTAL=y
# Flip 180 degrees if your display is mounted upside-down in the case.
CONFIG_DONGLE_SCREEN_FLIPPED=n

# --- OS icon shown when GUI/Super key is held ---
# 0 = macOS, 1 = Linux, 2 = Windows
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=0

# --- Brightness ---
# Maximum brightness the screen will reach (1-100).
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80
# Minimum brightness used during ambient-light dimming and keyboard steps (1-99).
CONFIG_DONGLE_SCREEN_MIN_BRIGHTNESS=5
# Startup / wake-up brightness. Lower than MAX so it is not blinding in a dark room.
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=40

# --- Idle / auto-off ---
# Turn off the backlight after 3 minutes of no keystrokes (180 s).
# Set to 0 to never auto-off. The display wakes again on the next keystroke.
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=180

# --- Ambient light sensor ---
# Enable if you have an Adafruit APDS9960 wired to the dongle.
# When enabled the display brightness tracks room lighting automatically.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
# How often (ms) the sensor is polled.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT_EVALUATION_INTERVAL_MS=1000
# Raw sensor range -- tune these if your sensor is behind plastic/diffuser.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT_MIN_RAW_VALUE=0
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT_MAX_RAW_VALUE=100

# --- Keyboard brightness control ---
# Assign F22/F23/F24 in your keymap to toggle / dim / brighten the screen.
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=y
# F22 = toggle display on/off
CONFIG_DONGLE_SCREEN_TOGGLE_KEYCODE=113
# F23 = brightness down
CONFIG_DONGLE_SCREEN_BRIGHTNESS_DOWN_KEYCODE=114
# F24 = brightness up
CONFIG_DONGLE_SCREEN_BRIGHTNESS_UP_KEYCODE=115
# How much brightness to add/subtract per keypress.
CONFIG_DONGLE_SCREEN_BRIGHTNESS_STEP=10

# --- Widgets ---
# All widgets are on by default. Disable any you do not want shown.
CONFIG_DONGLE_SCREEN_OUTPUT_ACTIVE=y    # USB/BLE connection indicator
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=y     # Active layer name
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=y  # Shift / Ctrl / Alt / GUI state
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=y       # Words-per-minute counter
CONFIG_DONGLE_SCREEN_BATTERY_ACTIVE=y   # Battery level for dongle + halves

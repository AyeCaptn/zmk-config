# The dongle is the central — enable USB HID output
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y

# BLE for connecting to peripherals (left and right halves)
CONFIG_BT=y
CONFIG_ZMK_BLE=y

# Number of peripherals: left + right = 2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
